  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AI Tools Knowledge Graph — Dream Machine" />
  <meta name="twitter:description" content="Interactive knowledge graph of 570+ AI tools across 19 categories." />

  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* Graph page overrides */
    body { overflow: hidden; }

    .graph-wrap {
      position: fixed;
      inset: 0;
      top: var(--nav-h);
      z-index: 1;
    }

    #graph-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #graph-canvas:active { cursor: grabbing; }

    /* HUD — top-left controls */
    .graph-hud {
      position: fixed;
      top: calc(var(--nav-h) + 16px);
      left: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .hud-search {
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 10, 31, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 14px;
      backdrop-filter: blur(12px);
    }
    .hud-search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      width: 200px;
    }
    .hud-search input::placeholder { color: var(--text-muted); }
    .hud-search .search-icon {
      color: var(--text-muted);
      font-size: 14px;
      flex-shrink: 0;
    }

    .hud-filters {
      pointer-events: all;
      background: rgba(10, 10, 31, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 14px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-filters label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-filters input[type=checkbox] {
      accent-color: var(--cyan);
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    .filter-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Hint pill */
    .graph-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 31, 0.75);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 11px;
      color: var(--text-muted);
      backdrop-filter: blur(8px);
      z-index: 20;
      pointer-events: none;
      letter-spacing: 0.02em;
    }
    .graph-wip {
      position: fixed;
      top: calc(var(--nav-h) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,51,204,0.12);
      border: 1px solid rgba(255,51,204,0.4);
      border-radius: 100px;
      padding: 5px 18px;
      font-size: 11px;
      font-weight: 600;
      color: var(--pink);
      backdrop-filter: blur(8px);
      z-index: 20;
      pointer-events: none;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    /* Tooltip */
    #graph-tooltip {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      max-width: 280px;
      background: rgba(10, 10, 31, 0.95);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 12px 16px;
      backdrop-filter: blur(16px);
      display: none;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    #graph-tooltip.visible { display: block; }
    .tt-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .tt-cat {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .tt-blurb {
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .tt-url {
      font-size: 10px;
      color: var(--cyan);
      opacity: 0.8;
    }
    .tt-click {
      font-size: 10px;
      color: var(--pink);
      margin-top: 4px;
    }

    /* Legend */
    .graph-legend {
      position: fixed;
      top: calc(var(--nav-h) + 16px);
      right: 16px;
      z-index: 20;
      background: rgba(10, 10, 31, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(12px);
      max-width: 220px;
    }
    .legend-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 10.5px;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.15s;
    }
    .legend-item:hover { color: var(--text); }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-item.dimmed { opacity: 0.35; }

    /* ── Click detail panel ──────────────────────────────────── */
    .detail-panel {
      position: fixed;
      top: var(--nav-h);
      right: 0;
      bottom: 0;
      width: 300px;
      max-width: 90vw;
      background: rgba(8, 8, 26, 0.97);
      border-left: 1px solid rgba(200,255,102,0.18);
      backdrop-filter: blur(20px);
      z-index: 30;
      transform: translateX(102%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .detail-panel.is-open { transform: translateX(0); }
    .detail-panel__head {
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: relative;
    }
    .detail-close {
      position: absolute;
      top: 14px; right: 14px;
      background: none; border: none;
      color: rgba(255,255,255,0.35);
      font-size: 18px; cursor: pointer;
      transition: color 0.15s;
      padding: 4px; line-height: 1;
    }
    .detail-close:hover { color: var(--lime); }
    #dp-name {
      font-size: 15px; font-weight: 700;
      line-height: 1.3; margin-bottom: 6px;
      padding-right: 28px;
    }
    #dp-meta {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; color: rgba(255,255,255,0.4);
    }
    .detail-panel__body { padding: 16px 20px; flex: 1; }
    #dp-blurb {
      font-size: 12.5px; line-height: 1.65;
      color: rgba(255,255,255,0.68); margin-bottom: 16px;
    }
    .dp-issues-label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.08em; color: rgba(255,255,255,0.32);
      margin-bottom: 8px;
    }
    .dp-issues-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
    .dp-issue-badge {
      font-size: 10px; font-weight: 700;
      padding: 3px 9px; border-radius: 5px;
      background: rgba(200,255,102,0.1);
      border: 1px solid rgba(200,255,102,0.28);
      color: var(--lime); text-decoration: none;
      transition: background 0.15s;
    }
    .dp-issue-badge:hover { background: rgba(200,255,102,0.25); }
    #dp-link {
      display: none;
      align-items: center;
      gap: 8px;
      margin: 0 20px 20px;
      padding: 10px 16px;
      background: var(--mag);
      color: #0d0d0d;
      font-weight: 700; font-size: 13px;
      border-radius: 8px;
      transition: background 0.15s;
      text-decoration: none;
    }
    #dp-link:hover { background: var(--lime); }
    .dp-cat-count {
      font-size: 28px; font-weight: 900;
      color: var(--lime); margin: 8px 0 4px;
    }
    .dp-cat-label {
      font-size: 11px; color: rgba(255,255,255,0.4);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- Search + filter HUD -->
