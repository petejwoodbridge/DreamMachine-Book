<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Graph — Dream Machine</title>
  <meta name="description" content="Interactive knowledge graph of 570+ AI tools across 19 categories — visualised as a force-directed network." />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* Graph page overrides */
    body { overflow: hidden; }

    .graph-wrap {
      position: fixed;
      inset: 0;
      top: var(--nav-h);
      z-index: 1;
    }

    #graph-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #graph-canvas:active { cursor: grabbing; }

    /* HUD — top-left controls */
    .graph-hud {
      position: fixed;
      top: calc(var(--nav-h) + 16px);
      left: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .hud-search {
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 10, 31, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 14px;
      backdrop-filter: blur(12px);
    }
    .hud-search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      width: 200px;
    }
    .hud-search input::placeholder { color: var(--text-muted); }
    .hud-search .search-icon {
      color: var(--text-muted);
      font-size: 14px;
      flex-shrink: 0;
    }

    .hud-filters {
      pointer-events: all;
      background: rgba(10, 10, 31, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 14px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-filters label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-filters input[type=checkbox] {
      accent-color: var(--cyan);
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    .filter-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Hint pill */
    .graph-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 31, 0.75);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 11px;
      color: var(--text-muted);
      backdrop-filter: blur(8px);
      z-index: 20;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    /* Tooltip */
    #graph-tooltip {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      max-width: 280px;
      background: rgba(10, 10, 31, 0.95);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 12px 16px;
      backdrop-filter: blur(16px);
      display: none;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    #graph-tooltip.visible { display: block; }
    .tt-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .tt-cat {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .tt-blurb {
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .tt-url {
      font-size: 10px;
      color: var(--cyan);
      opacity: 0.8;
    }
    .tt-click {
      font-size: 10px;
      color: var(--pink);
      margin-top: 4px;
    }

    /* Legend */
    .graph-legend {
      position: fixed;
      top: calc(var(--nav-h) + 16px);
      right: 16px;
      z-index: 20;
      background: rgba(10, 10, 31, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(12px);
      max-width: 220px;
    }
    .legend-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 10.5px;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.15s;
    }
    .legend-item:hover { color: var(--text); }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-item.dimmed { opacity: 0.35; }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-grid"></div>

  <nav class="nav">
    <div class="container nav__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark">DREAM MACHINE</span>
        <span class="brand__tag">A creative's guide to AI</span>
      </a>
      <div class="nav__links">
        <a class="nav__link" href="tools.html">Toolkit</a>
        <a class="nav__link" href="use-cases.html">Use Cases</a>
        <a class="nav__link" href="issues.html">Issues</a>
        <a class="nav__link" href="editions.html">Newsletter</a>
        <a class="nav__link" href="graph.html">Graph</a>
        <a class="nav__link" href="book.html">Book</a>
        <a class="nav__cta" href="book.html">Read the book</a>
      </div>
    </div>
  </nav>

  <div class="graph-wrap">
    <svg id="graph-canvas"></svg>
  </div>

  <!-- Search + filter HUD -->
  <div class="graph-hud">
    <div class="hud-search">
      <span class="search-icon">⌕</span>
      <input id="graph-search" type="text" placeholder="Search tools…" autocomplete="off" spellcheck="false" />
    </div>
    <div class="hud-filters" id="layer-filters"></div>
  </div>

  <!-- Category legend -->
  <div class="graph-legend" id="graph-legend">
    <div class="legend-title">Categories</div>
    <div id="legend-items"></div>
  </div>

  <!-- Tooltip -->
  <div id="graph-tooltip">
    <div class="tt-name" id="tt-name"></div>
    <div class="tt-cat" id="tt-cat"></div>
    <div class="tt-blurb" id="tt-blurb"></div>
    <div class="tt-url" id="tt-url"></div>
    <div class="tt-click" id="tt-click"></div>
  </div>

  <!-- Hint -->
  <div class="graph-hint">Scroll to zoom · Drag to pan · Click a tool to open it · Drag nodes to move them</div>

  <script src="assets/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="assets/graph.js"></script>
</body>
</html>
